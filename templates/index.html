<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Career Management</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #dde5f7;
    --accent: #e07b00;
    --accent2: #0284c7;
    --text: #1a2040;
    --muted: #6b7aaa;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(79,112,220,0.12) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -180px; left: -180px;
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(224,123,0,0.13) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
  }

  .orb2 {
    position: fixed;
    bottom: -140px; right: -140px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(2,132,199,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── LOADING STATE ── */
  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
    font-size: 1rem;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── HERO ── */
  header {
    text-align: center;
    padding: 72px 0 48px;
    animation: fadeDown 0.8s ease both;
  }

  .badge {
    display: inline-block;
    background: rgba(224,123,0,0.1);
    border: 1px solid rgba(224,123,0,0.35);
    color: var(--accent);
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    margin-bottom: 24px;
    font-weight: 600;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 900;
    line-height: 1.08;
    background: linear-gradient(135deg, #1a2040 20%, #e07b00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 18px;
  }

  header p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
    font-weight: 400;
  }

  /* ── API STATUS BANNER ── */
  .api-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 32px;
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .api-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #059669;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── CAREER CARDS GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 52px;
    animation: fadeUp 0.9s 0.2s ease both;
  }

  .career-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(60,80,180,0.06);
  }

  .career-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 20px 20px 0 0;
    background: var(--clr);
    opacity: 0.65;
    transition: opacity 0.25s;
  }

  .career-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: var(--clr);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }

  .career-card:hover {
    transform: translateY(-6px);
    border-color: var(--clr);
    box-shadow: 0 16px 40px rgba(60,80,180,0.12), 0 0 0 1.5px var(--clr);
  }

  .career-card:hover::before { opacity: 1; }
  .career-card:hover::after  { opacity: 0.04; }

  .career-card.active {
    border-color: var(--clr);
    box-shadow: 0 0 0 2.5px var(--clr), 0 16px 40px rgba(60,80,180,0.14);
  }

  .career-card.active::before { opacity: 1; }

  .card-icon-wrap {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 16px;
  }

  .card-label {
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--clr);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .card-sub {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 26px;
    overflow: hidden;
    display: none;
    animation: fadeUp 0.4s ease both;
    box-shadow: 0 8px 40px rgba(60,80,180,0.10);
  }

  .detail-panel.visible { display: block; }

  .panel-header {
    padding: 36px 40px 28px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 20px;
    background: linear-gradient(120deg, rgba(240,244,255,0.9) 0%, #ffffff 100%);
  }

  .panel-icon-wrap {
    width: 62px; height: 62px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .panel-title-block h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
    margin-top: 4px;
  }

  .panel-title-block .pill {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
  }

  .panel-body {
    padding: 36px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    background: #fafbff;
  }

  @media (max-width: 700px) {
    .panel-body { grid-template-columns: 1fr; }
    .panel-header { flex-direction: column; }
    .panel-header, .panel-body { padding: 24px 20px; }
  }

  .info-row { display: flex; flex-direction: column; gap: 16px; }

  .info-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 6px rgba(60,80,180,0.05);
    transition: box-shadow 0.2s;
  }

  .info-item:hover { box-shadow: 0 4px 16px rgba(60,80,180,0.10); }

  .info-item .ico { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }

  .info-item .lbl {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 3px;
  }

  .info-item .val {
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 500;
    line-height: 1.5;
  }

  .list-section { grid-column: 1 / -1; }

  .list-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 600px) { .list-grid { grid-template-columns: 1fr; } }

  .list-box {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 6px rgba(60,80,180,0.05);
  }

  .list-box h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .list-box h3 span { font-size: 1rem; }

  .list-box ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .list-box li {
    font-size: 0.88rem;
    color: var(--text);
    font-weight: 500;
    padding: 9px 14px;
    background: #f5f7ff;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }

  .list-box li:hover {
    background: color-mix(in srgb, var(--accent-li) 8%, #fff);
    border-color: var(--accent-li);
    transform: translateX(3px);
  }

  .list-box li::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-li);
    flex-shrink: 0;
  }

  /* ── CLOSE BUTTON ── */
  .close-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    padding: 11px 26px;
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--muted);
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
    width: fit-content;
    margin-left: 40px;
    margin-bottom: 36px;
    box-shadow: 0 2px 8px rgba(60,80,180,0.08);
  }

  .close-btn:hover {
    border-color: #e07b00;
    color: #e07b00;
    background: rgba(224,123,0,0.05);
    box-shadow: 0 4px 16px rgba(224,123,0,0.15);
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-top: 48px;
    border-top: 1.5px solid var(--border);
    margin-top: 48px;
    letter-spacing: 0.04em;
    animation: fadeUp 1s 0.4s ease both;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="orb2"></div>
<div class="wrapper">

  <header>
    <div class="badge">✦ Your Future Starts Here</div>
    <h1>Career Management</h1>
    <p>Explore career paths, eligibility, study materials, and notifications — all in one place.</p>
  </header>

  <!-- Live API indicator -->
  <div class="api-banner">
    <span class="api-dot"></span>
    Live data from Python Flask API
  </div>

  <!-- Cards injected by JS after fetching /api/careers -->
  <div class="grid" id="careerGrid">
    <div class="loading">⏳ Loading careers from server…</div>
  </div>

  <div class="detail-panel" id="detailPanel"></div>

  <footer>© 2025 Career Management &nbsp;·&nbsp; All Rights Reserved</footer>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let activeId  = null;
let careersData = [];

// ── Fetch careers from Flask API ──────────────────────────────────────────
async function loadCareers() {
  try {
    const res  = await fetch('/api/careers');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    careersData = await res.json();
    buildCards(careersData);
  } catch (err) {
    document.getElementById('careerGrid').innerHTML =
      `<div class="loading" style="color:#e07b00">⚠️ Could not load careers (${err.message})</div>`;
  }
}

// ── Build career cards ────────────────────────────────────────────────────
function buildCards(careers) {
  const grid = document.getElementById('careerGrid');
  grid.innerHTML = '';

  careers.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'career-card';
    card.style.setProperty('--clr', c.clr);
    card.style.animationDelay = `${0.1 + i * 0.08}s`;
    card.innerHTML = `
      <div class="card-icon-wrap" style="background:${c.bgLight}">${c.icon}</div>
      <div class="card-label">${c.label}</div>
      <div class="card-title">${c.name}</div>
      <div class="card-sub">${c.sub}</div>
    `;
    card.addEventListener('click', () => openDetail(c, card));
    grid.appendChild(card);
  });
}

// ── Open detail panel ─────────────────────────────────────────────────────
function openDetail(c, card) {
  if (activeId === c.id) {
    activeId = null;
    card.classList.remove('active');
    document.getElementById('detailPanel').classList.remove('visible');
    return;
  }

  document.querySelectorAll('.career-card').forEach(el => el.classList.remove('active'));
  card.classList.add('active');
  activeId = c.id;

  const docItems  = c.documents.map(d => `<li style="--accent-li:${c.clr}">${d}</li>`).join('');
  const bookItems = c.books.map(b => `<li style="--accent-li:${c.clr}">${b}</li>`).join('');

  const panel = document.getElementById('detailPanel');
  panel.style.borderColor    = c.clr + '44';
  panel.style.borderTopColor = c.clr;
  panel.style.borderTopWidth = '4px';

  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-icon-wrap" style="background:${c.bgLight}">${c.icon}</div>
      <div class="panel-title-block">
        <span class="pill" style="background:${c.clr}">${c.label}</span>
        <h2>${c.name}</h2>
      </div>
    </div>
    <div class="panel-body">
      <div class="info-row">
        <div class="info-item">
          <span class="ico">🎓</span>
          <div><div class="lbl">Qualification</div><div class="val">${c.qualification}</div></div>
        </div>
        <div class="info-item">
          <span class="ico">🎂</span>
          <div><div class="lbl">Age Limit</div><div class="val">${c.age}</div></div>
        </div>
        <div class="info-item">
          <span class="ico">👥</span>
          <div><div class="lbl">Gender</div><div class="val">${c.gender}</div></div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-item">
          <span class="ico">✅</span>
          <div><div class="lbl">Eligibility</div><div class="val">${c.eligibility}</div></div>
        </div>
        <div class="info-item">
          <span class="ico">🔔</span>
          <div><div class="lbl">Notification</div><div class="val">${c.notification}</div></div>
        </div>
      </div>
      <div class="list-section">
        <div class="list-grid">
          <div class="list-box">
            <h3><span>📄</span> Required Documents</h3>
            <ul>${docItems}</ul>
          </div>
          <div class="list-box">
            <h3><span>📖</span> Recommended Books</h3>
            <ul>${bookItems}</ul>
          </div>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closePanel()">✕ &nbsp;Close</button>
  `;

  panel.classList.add('visible');
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
}

// ── Close panel ───────────────────────────────────────────────────────────
function closePanel() {
  activeId = null;
  document.querySelectorAll('.career-card').forEach(el => el.classList.remove('active'));
  document.getElementById('detailPanel').classList.remove('visible');
}

// ── Boot ──────────────────────────────────────────────────────────────────
loadCareers();
</script>
</body>
</html>
